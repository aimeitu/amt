<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta id="redirect-meta" http-equiv="refresh" content="0;url=https://aimeitu01.com/promo/test01">

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get("slug") || "test01";
            const target = "https://aimeitu01.com/promo/" + encodeURIComponent(slug);
            document.getElementById("redirect-meta")
                .setAttribute("content", "0;url=" + target);
            window.location.replace(target);
        })();
    </script>
</head>
<body></body>
</html>
