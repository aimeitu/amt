<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no">
    <title>爱美图 - 最新地址发布页</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <link rel="dns-prefetch" href="//aimeitu01.com">
    <link rel="preconnect" href="https://aimeitu01.com" crossorigin>

    <style>
        :root {
            --primary: #f04494;
            --primary-hover: #c94a84;
            --link-blue: #0066cc; /* 定义标准的点击蓝 */
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(240, 68, 148, 0.08);
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #f8bbd9 0%, #f04494 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header h2 {
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 30px 0;
            color: var(--text-muted);
        }

        .status-box {
            background: #fffafa;
            border: 1px solid #ffe4ed;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 30px;
        }

        .status-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 50px;
            margin-bottom: 10px;
        }

        .status-online {
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .status-maintenance {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            display: none;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .online-dot {
            background-color: var(--success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            animation: blink 2s infinite;
        }

        .offline-dot {
            background-color: var(--error);
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .url-link {
            display: block;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 15px;
            transition: transform 0.2s ease;
        }

        .url-link:hover {
            transform: translateY(-2px);
        }

        /* 核心修改：为域名块加上蓝色划线 */
        .clickable-domain {
            display: inline-block;
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            background: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(240, 68, 148, 0.15);
            transition: all 0.3s ease;
            
            /* 蓝色下划线样式 */
            text-decoration: underline;
            text-decoration-color: var(--link-blue);
            text-decoration-thickness: 2px;
            text-underline-offset: 6px;
        }

        /* 悬停时整体变色，划线随之变为白色以保证视觉对比度 */
        .url-link:hover .clickable-domain {
            background: var(--primary);
            color: #fff;
            text-decoration-color: #ffffff;
            box-shadow: 0 6px 20px rgba(240, 68, 148, 0.3);
        }

        .footer-info {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.8;
            border-top: 1px dashed #e5e7eb;
            padding-top: 20px;
            margin-top: 10px;
        }

        .footer-info p {
            margin: 0;
        }

        /* 核心修改：为邮箱链接也加上蓝色划线 */
        .email-link {
            color: var(--primary);
            font-weight: 600;
            text-decoration: underline;
            text-decoration-color: var(--link-blue);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .email-link:hover {
            color: var(--link-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>爱美图</h1>
            <!-- <h2>最新地址发布页 · 官方防失联导航入口</h2> -->
        </header>

        <section class="status-box">
            <!-- <div id="status-online-ui" class="status-text status-online">
                <span class="status-indicator online-dot"></span>
                当前状态：网站正常运行
            </div>

            <div id="status-offline-ui" class="status-text status-maintenance">
                <span class="status-indicator offline-dot"></span>
                当前状态：服务器维护中
            </div>
            
            <br> -->
            
            <a id="latest-domain"
               href="#"
               class="url-link"
               title="爱美图最新可访问域名">
                最新域名：👇🏻点击进入<br><br>
                <span id="domain-text" class="clickable-domain">
                    aimeitu01.com
                </span>
            </a>
        </section>

        <footer class="footer-info">
            <p>
                建议收藏本页面（Ctrl+D）以防失联。<br>
                本页面会实时更新爱美图最新地址与可访问入口。<br><br>
                <!-- 联系站长：
                <a href="mailto:hongchenkezhan@protonmail.com" class="email-link">
                    hongchenkezhan@protonmail.com
                </a> -->
            </p>
        </footer>
    </div>

    <script>
        const SITE_DOMAIN = 'aimeitu01.com';
        const DEFAULT_SLUG = 'test01';

        // 1. 保留：Slug 解析与目标 URL 拼接逻辑
        const slug = new URLSearchParams(location.search).get('slug')?.trim() || DEFAULT_SLUG;
        const promoUrl = `https://${SITE_DOMAIN}/promo/${encodeURIComponent(slug)}`;

        // 将解析好的目标链接赋给核心 a 标签
        document.getElementById('latest-domain').href = promoUrl;
        
        // 动态同步展示的域名文字
        document.getElementById('domain-text').innerText = SITE_DOMAIN;

        // 2. 保留：DNS 和链接预加载（Preload/Prefetch）逻辑
        function warmupPromoHost() {
            fetch(`https://${SITE_DOMAIN}/`, {
                mode: 'no-cors',
                credentials: 'omit',
                cache: 'force-cache'
            }).catch(() => {});
        }

        function prefetchPromoPage() {
            if (document.querySelector('link[data-promo-prefetch]')) {
                return;
            }

            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = promoUrl;
            link.as = 'document';
            link.setAttribute('data-promo-prefetch', '1');

            document.head.appendChild(link);
        }

        let promoIntentFetched = false;

        function intentFetchPromo() {
            if (promoIntentFetched) {
                return;
            }

            promoIntentFetched = true;

            fetch(promoUrl, {
                mode: 'no-cors',
                credentials: 'omit'
            }).catch(() => {});
        }

        // 3. 保留：页面加载及交互事件绑定
        window.addEventListener('load', () => {
            warmupPromoHost();

            setTimeout(() => {
                prefetchPromoPage();
            }, 1500);
        });

        // 鼠标划入链接或状态盒子时触发预获取
        document.addEventListener(
            'pointerover',
            (event) => {
                if (event.target.closest('#latest-domain, .status-box')) {
                    intentFetchPromo();
                }
            },
            { passive: true }
        );

        // 移动端触摸时触发预获取
        document.addEventListener(
            'touchstart',
            () => {
                intentFetchPromo();
            },
            { once: true, passive: true }
        );
    </script>
</body>
</html>
